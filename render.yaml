# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# Paid, persistent services. Review current costs in Render before deploying.
services:
  - type: web
    name: jevs-mailroom
    runtime: node
    region: ohio
    plan: 0.5c-512mb
    numInstances: 1
    buildCommand: npm ci --include=dev && npm run build
    preDeployCommand: node dist/server/migrate.js
    startCommand: npm start
    healthCheckPath: /readyz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: AI_MODE
        value: live
      - key: DATABASE_URL
        fromDatabase:
          name: jevs-mailroom-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: jevs-mailroom-queue
          type: keyvalue
          property: connectionString
      - key: RECEIPT_SECRET
        generateValue: true
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        sync: false
      - key: OPENROUTER_TIMEOUT_MS
        value: "15000"
      - key: MAX_QUEUE
        value: "40"
      - key: SUBMISSIONS_PER_MINUTE
        value: "5"
  - type: worker
    name: jevs-mailroom-worker
    runtime: node
    region: ohio
    plan: 0.5c-512mb
    numInstances: 1
    buildCommand: npm ci --include=dev && npm run build
    preDeployCommand: node dist/server/migrate.js
    startCommand: npm run worker
    maxShutdownDelaySeconds: 60
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: AI_MODE
        value: live
      - key: DATABASE_URL
        fromDatabase:
          name: jevs-mailroom-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: jevs-mailroom-queue
          type: keyvalue
          property: connectionString
      - key: RECEIPT_SECRET
        fromService:
          name: jevs-mailroom
          type: web
          envVarKey: RECEIPT_SECRET
      - key: OPENROUTER_API_KEY
        fromService:
          name: jevs-mailroom
          type: web
          envVarKey: OPENROUTER_API_KEY
      - key: OPENROUTER_MODEL
        fromService:
          name: jevs-mailroom
          type: web
          envVarKey: OPENROUTER_MODEL
      - key: OPENROUTER_TIMEOUT_MS
        value: "15000"
      - key: AI_CONCURRENCY
        value: "2"
      - key: DAILY_AI_LIMIT
        value: "500"
  - type: keyvalue
    name: jevs-mailroom-queue
    region: ohio
    plan: 256mb
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  - name: jevs-mailroom-db
    region: ohio
    plan: 0.1c-256mb
    databaseName: mailroom
    user: jev
    postgresMajorVersion: "17"
    ipAllowList: []
